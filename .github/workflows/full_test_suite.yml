name: Run Python Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -e ".[dev,hf]"
            - name: Cache CIFAR-10
              id: cifar-cache
              uses: actions/cache@v4
              with:
                  path: data
                  key: cifar10-v1
            - name: Download CIFAR-10
              if: steps.cifar-cache.outputs.cache-hit != 'true'
              run: python -m scripts.download_cifar10
            - name: Run Tests
              run: python -m pytest -q
